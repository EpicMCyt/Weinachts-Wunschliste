<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Wunschliste</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 pb-12 relative">

    <!-- Admin-Button oben links -->
    <button onclick="toggleAdminLogin()" class="absolute top-4 left-4 text-zinc-500 hover:text-zinc-300 p-2 transition-colors z-20">
        <i class="fa-solid fa-key text-xl"></i>
    </button>

    <!-- verstecktes Passwort-Eingabefeld (Ersatz für prompt mit Sternchen) -->
    <div id="admin-login-box" class="hidden absolute top-14 left-4 bg-zinc-900 p-3 rounded-xl border border-zinc-700 shadow-xl z-20 flex gap-2">
        <input type="password" id="admin-password-input" placeholder="Admin Passwort" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-zinc-500">
        <button onclick="submitAdminLogin()" class="bg-zinc-700 hover:bg-zinc-600 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition-colors">OK</button>
    </div>

    <!-- Header -->
    <header class="text-center py-12 px-4 bg-zinc-900 border-b border-zinc-800 shadow-xl">
        <h1 class="text-4xl md:text-5xl font-extrabold text-zinc-100 tracking-wide mb-3">Lucas Wunschliste</h1>
    </header>

    <!-- Wunsch-Grid -->
    <main class="max-w-6xl mx-auto px-4 mt-10">
        <div id="wishlist-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Wünsche werden hier in Echtzeit geladen -->
        </div>

        <!-- Admin-Bereich (standardmäßig versteckt) -->
        <div id="admin-section" class="hidden mt-16 space-y-10 max-w-xl mx-auto">

            <!-- Wunsch hinzufügen / bearbeiten -->
            <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="form-title" class="text-xl font-semibold text-zinc-200"><i class="fa-solid fa-plus-circle mr-2"></i> Neuen Wunsch hinzufügen</h2>
                    <span class="text-xs bg-zinc-800 text-zinc-300 border border-zinc-700 px-2 py-1 rounded">Admin Aktiv</span>
                </div>
                <form id="add-wish-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-zinc-300 mb-1">Produktname</label>
                        <input type="text" id="new-title" required class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-zinc-500" placeholder="z.B. Nintendo Switch">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1">Preis (€)</label>
                            <input type="number" step="0.01" id="new-price" required class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-zinc-500" placeholder="49.99">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1">Bild-URL</label>
                            <input type="url" id="new-image" required class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-zinc-500" placeholder="https://...">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-300 mb-1">Shop-Link</label>
                        <input type="url" id="new-link" required class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-zinc-500" placeholder="https://amazon.de/...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-300 mb-1">Kommentar</label>
                        <textarea id="new-desc" rows="2" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-zinc-500" placeholder="z.B. Farbe, Größe, Notizen..."></textarea>
                    </div>
                    <div class="flex gap-3">
                        <button type="submit" id="submit-btn" class="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-medium py-3 px-4 rounded-xl transition-colors shadow-lg">
                            Wunsch speichern
                        </button>
                        <button type="button" id="cancel-edit-btn" onclick="resetWishForm()" class="hidden bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 px-4 rounded-xl transition-colors border border-zinc-700">
                            Abbrechen
                        </button>
                    </div>
                </form>
            </div>

            <!-- Eingegangene Vorschläge (Nur im Admin-Modus sichtbar) -->
            <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-700 shadow-xl">
                <h2 class="text-xl font-semibold text-zinc-200 mb-4"><i class="fa-solid fa-lightbulb mr-2 text-yellow-400"></i> Eingegangene Vorschläge</h2>
                <div id="suggestions-container" class="space-y-4">
                    <!-- Vorschläge werden hier geladen -->
                    <p class="text-zinc-500 text-sm">Keine Vorschläge vorhanden.</p>
                </div>
            </div>

        </div>

        <!-- Vorschlags-Bereich für alle Besucher -->
        <div class="mt-20 bg-zinc-900/60 p-6 rounded-2xl border border-zinc-800 shadow-xl max-w-xl mx-auto">
            <h2 class="text-lg font-semibold text-zinc-200 mb-2"><i class="fa-solid fa-comment-dots mr-2"></i> Idee oder Wunsch vorschlagen</h2>
            <p class="text-zinc-400 text-xs mb-4">Hier kannst du zusätzliche Wunsch ideen vorschlagen.</p>
            <form id="suggestion-form" class="space-y-3">
                <div>
                    <input type="text" id="sug-title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-zinc-600" placeholder="Idee / Produktname *">
                </div>
                <div>
                    <input type="url" id="sug-link" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-zinc-600" placeholder="Shop-Link (optional)">
                </div>
                <div>
                    <textarea id="sug-comment" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-zinc-600" placeholder="Kommentar / Warum das eine gute Idee ist (optional)"></textarea>
                </div>
                <button type="submit" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium py-2.5 px-4 rounded-xl text-sm transition-colors shadow">
                    Vorschlag abschicken
                </button>
            </form>
        </div>
    </main>

    <script>
        // Firebase Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyCffMmleSrb1Dx7WF9JoFyx98AY9opN6Wc",
            authDomain: "wunschliste-94d0e.firebaseapp.com",
            projectId: "wunschliste-94d0e",
            storageBucket: "wunschliste-94d0e.firebasestorage.app",
            messagingSenderId: "504589702635",
            appId: "1:504589702635:web:b4dee1c88bbbc9562b35ae"
        };

        // Firebase initialisieren
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const container = document.getElementById('wishlist-container');
        const adminSection = document.getElementById('admin-section');
        const suggestionsContainer = document.getElementById('suggestions-container');
        const loginBox = document.getElementById('admin-login-box');
        const passwordInput = document.getElementById('admin-password-input');

        // Admin-Status & Bearbeitungs-ID
        let isAdmin = false;
        let editingWishId = null;

        // Login-Box ein- / ausblenden
        window.toggleAdminLogin = function() {
            if (isAdmin) {
                alert("Admin-Modus ist bereits aktiv!");
                return;
            }
            loginBox.classList.toggle('hidden');
            if (!loginBox.classList.contains('hidden')) {
                passwordInput.focus();
            }
        };

        // Passwort prüfen ("IamEpicMClol")
        window.submitAdminLogin = function() {
            const enteredPassword = passwordInput.value;
            if (enteredPassword === "IamEpicMClol") {
                isAdmin = true;
                loginBox.classList.add('hidden');
                passwordInput.value = '';
                adminSection.classList.remove('hidden');
                adminSection.scrollIntoView({ behavior: 'smooth' });
                loadWishlist();
                loadSuggestions();
            } else {
                alert("Falsches Passwort!");
                passwordInput.value = '';
            }
        };

        // Enter-Taste im Passwortfeld unterstützen
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitAdminLogin();
            }
        });

        // Wünsche in Echtzeit laden
        function loadWishlist() {
            db.collection('wishes').onSnapshot((snapshot) => {
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = '<p class="col-span-full text-center text-zinc-400 py-8">Noch keine Wünsche vorhanden.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const wish = doc.data();
                    const id = doc.id;
                    const isReserved = wish.reserved || false;
                    const commentText = wish.description || wish.comment || '';

                    const card = document.createElement('a');
                    card.href = wish.link;
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";
                    card.className = `block bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 shadow-xl flex flex-col justify-between transition-all ${isReserved ? 'opacity-60' : 'hover:scale-[1.02] hover:border-zinc-600'}`;

                    // Admin-Buttons oben rechts (Stift & Mülleimer)
                    const adminButtonsHtml = isAdmin ? `
                        <div class="absolute top-3 right-3 flex gap-2 z-10">
                            <button onclick="editWish(event, '${id}', '${encodeURIComponent(wish.title)}', ${wish.price}, '${encodeURIComponent(wish.image)}', '${encodeURIComponent(wish.link)}', '${encodeURIComponent(commentText)}')" class="bg-blue-600 hover:bg-blue-500 text-white w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition-colors" title="Wunsch bearbeiten">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteWish(event, '${id}')" class="bg-red-600 hover:bg-red-500 text-white w-9 h-9 rounded-full flex items-center justify-center shadow-lg transition-colors" title="Wunsch löschen">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>` : '';

                    const reservedBadgeHtml = isReserved ? `
                        <span class="absolute top-3 ${isAdmin ? 'left-3' : 'right-3'} bg-zinc-950 text-zinc-300 text-xs px-3 py-1 rounded-full font-bold border border-zinc-700">Reserviert</span>` : '';

                    card.innerHTML = `
                        <div>
                            <div class="h-52 w-full overflow-hidden relative bg-zinc-950 flex items-center justify-center p-3">
                                <img src="${wish.image}" alt="${wish.title}" class="max-h-full max-w-full object-contain">
                                ${reservedBadgeHtml}
                                ${adminButtonsHtml}
                            </div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2 gap-2">
                                    <h3 class="text-lg font-bold text-white">${wish.title}</h3>
                                    <span class="bg-zinc-800 text-zinc-200 text-sm px-3 py-1 rounded-full font-bold border border-zinc-700 shrink-0">${Number(wish.price).toFixed(2).replace('.', ',')} €</span>
                                </div>
                                ${commentText ? `<p class="text-zinc-400 text-sm mb-4"><span class="font-semibold text-zinc-300">Kommentar:</span> ${commentText}</p>` : ''}
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <button onclick="toggleReserve(event, '${id}', ${isReserved})" class="w-full ${isReserved ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700' : 'bg-zinc-100 hover:bg-white text-zinc-900'} text-sm py-2.5 px-3 rounded-xl font-semibold transition-colors shadow-lg">
                                ${isReserved ? 'Freigeben' : 'Reservieren'}
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        // Initiales Laden
        loadWishlist();

        // Vorschläge in Echtzeit laden (nur für Admin)
        function loadSuggestions() {
            db.collection('suggestions').onSnapshot((snapshot) => {
                suggestionsContainer.innerHTML = '';

                if (snapshot.empty) {
                    suggestionsContainer.innerHTML = '<p class="text-zinc-500 text-sm">Keine Vorschläge vorhanden.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const sug = doc.data();
                    const sugId = doc.id;

                    const item = document.createElement('div');
                    item.className = "bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-2";
                    item.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-white text-base">${sug.title}</h4>
                            <div class="flex gap-2">
                                <button onclick="acceptSuggestion('${sugId}', '${encodeURIComponent(sug.title)}', '${encodeURIComponent(sug.link || '')}', '${encodeURIComponent(sug.comment || '')}')" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors" title="Als Wunsch übernehmen">
                                    <i class="fa-solid fa-check mr-1"></i> Akzeptieren
                                </button>
                                <button onclick="deleteSuggestion('${sugId}')" class="bg-red-900 hover:bg-red-800 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors" title="Ablehnen">
                                    <i class="fa-solid fa-xmark mr-1"></i> Ablehnen
                                </button>
                            </div>
                        </div>
                        ${sug.link ? `<p class="text-xs text-blue-400 truncate"><a href="${sug.link}" target="_blank"><i class="fa-solid fa-link mr-1"></i>${sug.link}</a></p>` : ''}
                        ${sug.comment ? `<p class="text-xs text-zinc-400"><span class="font-semibold text-zinc-300">Kommentar:</span> ${sug.comment}</p>` : ''}
                    `;
                    suggestionsContainer.appendChild(item);
                });
            });
        }

        // Besucher schickt einen Vorschlag ab
        const suggestionForm = document.getElementById('suggestion-form');
        suggestionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            db.collection('suggestions').add({
                title: document.getElementById('sug-title').value,
                link: document.getElementById('sug-link').value,
                comment: document.getElementById('sug-comment').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                suggestionForm.reset();
                alert('Vorschlag erfolgreich abgeschickt! Danke dir!');
            }).catch((error) => {
                console.error("Fehler beim Senden: ", error);
                alert('Fehler beim Abschicken.');
            });
        });

        // Vorschlag akzeptieren
        window.acceptSuggestion = function(id, title, link, comment) {
            resetWishForm();
            document.getElementById('new-title').value = decodeURIComponent(title);
            document.getElementById('new-link').value = decodeURIComponent(link);
            document.getElementById('new-desc').value = decodeURIComponent(comment);

            document.getElementById('add-wish-form').scrollIntoView({ behavior: 'smooth' });
            db.collection('suggestions').doc(id).delete();
        };

        // Vorschlag ablehnen / löschen
        window.deleteSuggestion = function(id) {
            db.collection('suggestions').doc(id).delete();
        };

        // Wunsch bearbeiten (Daten ins Formular laden)
        window.editWish = function(event, id, title, price, image, link, desc) {
            event.preventDefault();
            event.stopPropagation();

            editingWishId = id;
            document.getElementById('new-title').value = decodeURIComponent(title);
            document.getElementById('new-price').value = price;
            document.getElementById('new-image').value = decodeURIComponent(image);
            document.getElementById('new-link').value = decodeURIComponent(link);
            document.getElementById('new-desc').value = decodeURIComponent(desc);

            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen mr-2"></i> Wunsch bearbeiten';
            document.getElementById('submit-btn').textContent = 'Änderungen speichern';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            document.getElementById('add-wish-form').scrollIntoView({ behavior: 'smooth' });
        };

        // Formular nach dem Bearbeiten/Abbrechen zurücksetzen
        window.resetWishForm = function() {
            editingWishId = null;
            document.getElementById('add-wish-form').reset();
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-plus-circle mr-2"></i> Neuen Wunsch hinzufügen';
            document.getElementById('submit-btn').textContent = 'Wunsch speichern';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        };

        // Wunsch löschen
        window.deleteWish = function(event, id) {
            event.preventDefault();
            event.stopPropagation();
            db.collection('wishes').doc(id).delete().catch((error) => {
                console.error("Fehler beim Löschen: ", error);
                alert("Fehler beim Löschen des Wunsches.");
            });
        };

        // Reservierungsstatus umschalten
        window.toggleReserve = function(event, id, currentStatus) {
            event.preventDefault();
            event.stopPropagation();
            db.collection('wishes').doc(id).update({
                reserved: !currentStatus
            });
        };

        // Neuen Wunsch hinzufügen oder bestehenden aktualisieren
        const form = document.getElementById('add-wish-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const wishData = {
                title: document.getElementById('new-title').value,
                price: parseFloat(document.getElementById('new-price').value),
                image: document.getElementById('new-image').value,
                link: document.getElementById('new-link').value,
                description: document.getElementById('new-desc').value
            };

            if (editingWishId) {
                // Bearbeiten
                db.collection('wishes').doc(editingWishId).update(wishData).then(() => {
                    resetWishForm();
                    alert('Wunsch erfolgreich aktualisiert!');
                }).catch((error) => {
                    console.error("Fehler beim Aktualisieren: ", error);
                    alert('Fehler beim Aktualisieren.');
                });
            } else {
                // Neu erstellen
                wishData.reserved = false;
                db.collection('wishes').add(wishData).then(() => {
                    resetWishForm();
                    alert('Wunsch erfolgreich hinzugefügt!');
                }).catch((error) => {
                    console.error("Fehler beim Speichern: ", error);
                    alert('Fehler beim Speichern.');
                });
            }
        });
    </script>
</body>
</html>
